name: Build

# Artifacts per run:
#   macOS   Maretrix-<v>-macos-universal.dmg          (+ .app.tar.gz + .sig for the updater)
#   Linux   .deb, .rpm, .AppImage                     x86_64 and aarch64
#   Windows .msi, NSIS .exe — dispatch-only and currently BROKEN; see the windows job
#   Android .apk — FCM when credentials exist, FOSS otherwise; see the android job
#   iOS     unsigned .ipa (manual dispatch only - see the ios job comment)
#
# Pushing a v* tag creates a GitHub Release and attaches everything, including
# latest.json, which is what installed desktop apps poll.
#
# A dispatch run (no tag) creates NO release, so every platform job also runs
# actions/upload-artifact. tauri-action itself cannot upload artifacts — it only
# attaches assets to a Release — so without those steps a test run builds the
# bundles and throws them away.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated platforms to build: macos,linux,windows,android,ios'
        required: true
        # `windows` is deliberately NOT in the default: its build is currently
        # broken (see the windows job) and it must never be started by accident.
        default: 'macos,linux'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Matches devEngines in package.json and the Dockerfile pin.
  NODE_VERSION: '24.18.0'
  RUST_VERSION: '1.97.1'

jobs:
  # Creates the release up front so parallel platform jobs attach to one release
  # instead of racing to create it. Skipped for manual dispatch (no tag).
  create-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A hyphen in the tag means a semver prerelease (v1.1.0-rc1). Mark it
          # --prerelease so GitHub's /releases/latest keeps pointing at the last
          # real release: the desktop updater polls
          # .../releases/latest/download/latest.json and would otherwise push an
          # rc onto every installed client.
          case "${{ github.ref_name }}" in
            *-*) PRE="--prerelease" ;;
            *)   PRE="" ;;
          esac
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
            gh release create "${{ github.ref_name }}" \
              --title "Maretrix ${{ github.ref_name }}" \
              $PRE \
              --generate-notes

  macos:
    name: macOS (universal)
    needs: [create-release]
    if: ${{ !cancelled() && needs.create-release.result != 'failure' && (github.event_name == 'push' || contains(github.event.inputs.targets, 'macos')) }}
  # macos-latest, NOT macos-14/15: the pinned tauri-plugin-notifications rev uses
  # typed throws (`func f() throws(FFIResult)`), a Swift 6.0 / Xcode 16 feature.
  # macos-14 ships Xcode 15.x and cannot parse it. macos-latest tracks the newest
  # image GitHub provides, which also matches the modern macOS the owner tests on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # config.json is committed with EMPTY values - no homeserver list, no push
      # gateway, no theme catalog, no GIF keys - so the public fork carries no
      # credentials. The real values live in the gitignored config.secrets.json and
      # are merged in here from a repository secret. Without this step a downloaded
      # build ships the empty config and every tester has to type the homeserver by
      # hand; with it the build behaves like the served web client. Absent secret =>
      # empty config, exactly as before.
      - name: Apply config.secrets.json
        env:
          CFG: ${{ secrets.CONFIG_SECRETS_JSON }}
        run: |
          if [ -n "$CFG" ]; then
            printf '%s' "$CFG" | base64 -d > config.secrets.json
            python3 scripts/apply-config-secrets.py
          else
            echo "::warning::CONFIG_SECRETS_JSON absent - this build carries the empty config.json"
          fi
      # Stable code signature. rc1 signed ad-hoc ("-"), whose designated
      # requirement is the cdhash - it changes on every build, so the keychain
      # ACL for "Maretrix WebCrypto Master Key" never matches and macOS re-prompts
      # on every WebCrypto access. That is the call keychain loop. A self-signed
      # certificate gives a stable designated requirement, so "Always Allow"
      # persists across builds. There is no paid Apple account and no
      # notarization, so first launch still needs right-click -> Open.
      # Absent secret => falls back to ad-hoc, exactly as before.
      - name: Import macOS signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::MACOS_CERT_P12 absent - falling back to ad-hoc signing"
            exit 0
          fi
          # Throwaway keychain: it lives only for this runner. No secret needed.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$MACOS_CERT_P12" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm -f certificate.p12
          security find-identity -v -p codesigning build.keychain
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The certificate's CN. Falls back to ad-hoc when the p12 secret is absent.
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_CERT_P12 && vars.MACOS_SIGN_IDENTITY || '-' }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Maretrix {0}', github.ref_name) || '' }}
          releaseDraft: false
          includeUpdaterJson: true
          # tauri.js normally injects these; tauri-action calls tauri directly, so
          # pass them ourselves. Without `updater` the .sig files never appear.
          # `matrix-crypto` is NOT optional here: scripts/tauri.js always appends
          # it, and without it the engine_* commands are never registered while
          # src/client/initMatrix.ts still calls engine_store_exists() under Tauri,
          # which fails client init. `geolocation` is dropped on purpose (it pulls
          # play-services-location); that matches scripts/tauri.js.
          args: --target universal-apple-darwin --features wry,updater,matrix-crypto -- --no-default-features
      # tauri-action has NO artifact-upload input — it only attaches assets to a
      # GitHub Release, and only when a tag is supplied. On workflow_dispatch
      # tagName is empty, so without this step the bundles are built on the runner
      # and thrown away. Verified: run 38537177008 produced a DMG and a valid .sig
      # and still had zero artifacts.
      # The .app directory itself is skipped: it is large and the .tar.gz already
      # contains it.
      - name: Upload bundles
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: maretrix-macos-universal
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.tar.gz
            src-tauri/target/**/release/bundle/macos/*.sig
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.label }})
    needs: [create-release]
    if: ${{ !cancelled() && needs.create-release.result != 'failure' && (github.event_name == 'push' || contains(github.event.inputs.targets, 'linux')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64
            runner: ubuntu-22.04
            experimental: false
          # arm64 hosted runners are only free on public repos; keep it advisory
          # so an unavailable runner never fails the whole build.
          - label: aarch64
            runner: ubuntu-24.04-arm
            experimental: true
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev libfuse2 file \
            xdg-utils
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # config.json is committed with EMPTY values - no homeserver list, no push
      # gateway, no theme catalog, no GIF keys - so the public fork carries no
      # credentials. The real values live in the gitignored config.secrets.json and
      # are merged in here from a repository secret. Without this step a downloaded
      # build ships the empty config and every tester has to type the homeserver by
      # hand; with it the build behaves like the served web client. Absent secret =>
      # empty config, exactly as before.
      - name: Apply config.secrets.json
        env:
          CFG: ${{ secrets.CONFIG_SECRETS_JSON }}
        run: |
          if [ -n "$CFG" ]; then
            printf '%s' "$CFG" | base64 -d > config.secrets.json
            python3 scripts/apply-config-secrets.py
          else
            echo "::warning::CONFIG_SECRETS_JSON absent - this build carries the empty config.json"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Maretrix {0}', github.ref_name) || '' }}
          releaseDraft: false
          includeUpdaterJson: true
          args: --features wry,updater,matrix-crypto -- --no-default-features
      # See the macOS job: tauri-action cannot upload artifacts, and a dispatch run
      # has no tag to attach to. Without this, a test run leaves nothing behind.
      - name: Upload bundles
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: maretrix-linux-${{ matrix.label }}
          path: |
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
            src-tauri/target/**/release/bundle/appimage/*
            src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: error

  # DISPATCH-ONLY AND CURRENTLY BROKEN — do not add `windows` to a tagged
  # release or the dispatch default. The build fails to compile:
  #
  #   error[E0425]: cannot find function
  #     `default_window_icon_from_app_icon_resource` in module `::tauri::image`
  #     --> src\lib.rs:534  (.build(tauri::generate_context!()))
  #
  # Root cause: a version mismatch in src-tauri/Cargo.toml. `tauri` is pinned to
  # 2.11.5, but `tauri-codegen` is pinned to 2.7.0 in [build-dependencies] (added
  # for reproducible native builds). tauri-codegen 2.7.0 is the codegen that
  # ships with tauri 2.12.0: on Windows targets it emits a call to
  # `tauri::image::default_window_icon_from_app_icon_resource()`, a function that
  # was added to the `tauri` crate in 2.12.0 and does not exist in 2.11.5.
  # macOS/Linux/Android take the Unix code path (CachedIcon) and never hit it.
  #
  # Fixing it means aligning the pair, which is NOT a one-liner:
  #   (a) pin tauri-codegen back to 2.6.3 to match tauri 2.11.5 — loses the
  #       reproducible-build sorting, or
  #   (b) bump the whole tauri family (tauri, tauri-build, tauri-macros,
  #       tauri-runtime, tauri-runtime-wry) 2.11.5 -> 2.12.x — touches the
  #       toolchain that currently builds green on three other platforms.
  # Either way Cargo.lock must be regenerated (cargo update -p tauri-codegen).
  # Windows was never actually green: earlier "success" runs skipped the job.
  windows:
    name: Windows (dispatch-only; currently broken — see comment)
    needs: [create-release]
    if: ${{ !cancelled() && needs.create-release.result != 'failure' && github.event_name == 'workflow_dispatch' && contains(github.event.inputs.targets, 'windows') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # config.json is committed with EMPTY values - no homeserver list, no push
      # gateway, no theme catalog, no GIF keys - so the public fork carries no
      # credentials. The real values live in the gitignored config.secrets.json and
      # are merged in here from a repository secret. Without this step a downloaded
      # build ships the empty config and every tester has to type the homeserver by
      # hand; with it the build behaves like the served web client. Absent secret =>
      # empty config, exactly as before.
      - name: Apply config.secrets.json
        shell: bash
        env:
          CFG: ${{ secrets.CONFIG_SECRETS_JSON }}
        run: |
          if [ -n "$CFG" ]; then
            printf '%s' "$CFG" | base64 -d > config.secrets.json
            python3 scripts/apply-config-secrets.py
          else
            echo "::warning::CONFIG_SECRETS_JSON absent - this build carries the empty config.json"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Maretrix {0}', github.ref_name) || '' }}
          releaseDraft: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --features wry,updater,matrix-crypto -- --no-default-features
      # See the macOS job. Kept for the day the codegen/tauri mismatch above is
      # fixed and this job is re-enabled.
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: maretrix-windows
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/**/*.sig
          if-no-files-found: error


  # Android is opt-in (the targets input must name 'android'), and no device has
  # ever been tested against this, so it must not fail the release.
  #
  # Push transport: FCM. The client already ships native FCM support
  # (src/app/features/settings/notifications/NativePushNotifications.ts) and
  # sygnal on VPS2 already has `gcmpushkin` compiled in, so credentials are the
  # only thing missing. Supply them and this job builds the FCM APK; supply
  # nothing and the same command builds the FOSS one.
  #
  # The flavour is chosen in src-tauri/gen/android/app/build.gradle.kts, not
  # here: google-services.json present -> gms, absent -> foss. That keeps the
  # build honest, because a gms build without google-services.json links Firebase
  # and then cannot register a token — push that silently does nothing, which is
  # worse than an honest FOSS build.
  #
  # To switch FCM on: create the Firebase project, base64 its google-services.json
  # into the GOOGLE_SERVICES_JSON repository secret. The step below decodes it into
  # place. The server side additionally needs the matching service account on VPS2;
  # PENDING Category Q #56 has the full scope.
  android:
    name: Android
    needs: [create-release]
    if: ${{ !cancelled() && needs.create-release.result != 'failure' && ((github.event_name == 'workflow_dispatch' && contains(github.event.inputs.targets, 'android')) || (github.event_name == 'push' && contains(github.ref_name, '-'))) }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # v3 defaults to `packages: 'tools platform-tools'`, and Google stopped serving the
      # `tools` package — the action dies with "Failed to find package 'tools'" before any
      # build step runs. v4 dropped it from the default; `platform-tools` is requested
      # explicitly rather than relying on that. Verified against run 38568035392.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install NDK
        run: |
          # --licenses first: the NDK/CMake packages are behind the same licence gate, and
          # sdkmanager prompts interactively without this.
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      # config.json is committed with EMPTY values - no homeserver list, no push
      # gateway, no theme catalog, no GIF keys - so the public fork carries no
      # credentials. The real values live in the gitignored config.secrets.json and
      # are merged in here from a repository secret. Without this step a downloaded
      # build ships the empty config and every tester has to type the homeserver by
      # hand; with it the build behaves like the served web client. Absent secret =>
      # empty config, exactly as before.
      - name: Apply config.secrets.json
        env:
          CFG: ${{ secrets.CONFIG_SECRETS_JSON }}
        run: |
          if [ -n "$CFG" ]; then
            printf '%s' "$CFG" | base64 -d > config.secrets.json
            python3 scripts/apply-config-secrets.py
          else
            echo "::warning::CONFIG_SECRETS_JSON absent - this build carries the empty config.json"
          fi
      # Absent secret => nothing is written => gradle picks the FOSS flavour.
      # The value is passed via env rather than interpolated into the script so
      # that the secret's characters can never be read as shell syntax.
      - name: Materialise google-services.json (FCM)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS" ]; then
            printf '%s' "$GS" | base64 -d > src-tauri/gen/android/app/google-services.json
            python3 -c "import json,sys;d=json.load(open('src-tauri/gen/android/app/google-services.json'));print('FCM project:',d['project_info']['project_id'],'| package:',d['client'][0]['client_info']['android_client_info']['package_name'])"
          else
            echo "No GOOGLE_SERVICES_JSON secret — building the FOSS flavour."
          fi
      # Release signing. Without this the build falls back to Gradle's debug key,
      # which every runner regenerates — so each APK would carry a different
      # signature and users could never update in place. The keystore and its
      # password exist only as repository secrets. The gradle signingConfig reads
      # a single `password` key for both the store and the key, hence one value.
      - name: Materialise release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > /tmp/maretrix-release.jks
            {
              echo "storeFile=/tmp/maretrix-release.jks"
              echo "keyAlias=$KS_ALIAS"
              echo "password=$KS_PW"
            } > src-tauri/gen/android/keystore.properties
            echo "Release keystore materialised — APK will be release-signed."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 absent — APK falls back to the debug key."
          fi
      - name: Build APK
        run: pnpm tauri:wry android build --apk
      - uses: actions/upload-artifact@v4
        with:
          name: maretrix-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
      # Built with `tauri android build`, not tauri-action, so nothing attaches it
      # to a release. Do it explicitly on a tagged build.
      - name: Attach APK to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no apk produced"; exit 1; }
          gh release upload "${{ github.ref_name }}" "$APK" --clobber

  # Manual dispatch only. An unsigned IPA that the user re-signs with their own
  # Apple ID: no paid account, so no APNs and no App Group capability. On iOS the
  # installed PWA is strictly better (working web push, never expires), which is
  # why this is not part of a tagged release.
  ios:
    name: iOS (unsigned, experiment)
    needs: [create-release]
    if: ${{ !cancelled() && needs.create-release.result != 'failure' && ((github.event_name == 'workflow_dispatch' && contains(github.event.inputs.targets, 'ios')) || (github.event_name == 'push' && contains(github.ref_name, '-'))) }}
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # config.json is committed with EMPTY values - no homeserver list, no push
      # gateway, no theme catalog, no GIF keys - so the public fork carries no
      # credentials. The real values live in the gitignored config.secrets.json and
      # are merged in here from a repository secret. Without this step a downloaded
      # build ships the empty config and every tester has to type the homeserver by
      # hand; with it the build behaves like the served web client. Absent secret =>
      # empty config, exactly as before.
      - name: Apply config.secrets.json
        env:
          CFG: ${{ secrets.CONFIG_SECRETS_JSON }}
        run: |
          if [ -n "$CFG" ]; then
            printf '%s' "$CFG" | base64 -d > config.secrets.json
            python3 scripts/apply-config-secrets.py
          else
            echo "::warning::CONFIG_SECRETS_JSON absent - this build carries the empty config.json"
          fi
      - name: Fetch pinned LiveKit XCFrameworks (public, sha256-verified)
        run: pnpm ios:frameworks
      # src-tauri/gen/apple/* is gitignored, so the Xcode project does not exist
      # on a fresh checkout. `tauri ios build` refuses to run without it:
      #   "Xcode project directory .../src-tauri/gen/apple doesn't exist.
      #    Please run `tauri ios init` and try again."
      # `ios init` shells out to `pod install`, so CocoaPods must be on PATH
      # (the macos-15 image ships it; install defensively if it ever doesn't).
      - name: Ensure CocoaPods
        run: command -v pod >/dev/null 2>&1 || brew install cocoapods
      - name: Init iOS Xcode project
        run: pnpm tauri ios init --ci
      # `--no-sign` is the flag the tauri CLI documents for "skip code signing
      # when bundling". APPLE_SIGNING_IDENTITY='' alone does NOT stop xcodebuild
      # from demanding a team for the share-extension and app targets; it died
      # with "Signing for \"share-extension\" requires a development team"
      # (xcodebuild exit 65). --no-sign propagates CODE_SIGNING_ALLOWED=NO to
      # every target in the scheme.
      - name: Build app bundle (no signing identity)
        env:
          APPLE_SIGNING_IDENTITY: ''
        run: pnpm tauri:wry ios build --target aarch64 --no-sign
      - name: Package as unsigned .ipa
        run: |
          APP=$(find src-tauri/gen/apple/build -name '*.app' -maxdepth 4 | head -1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry maretrix-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: maretrix-ios-unsigned
          path: maretrix-unsigned.ipa
          if-no-files-found: warn
      # The IPA is zipped by hand, not by tauri-action, so attach it explicitly.
      - name: Attach IPA to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" maretrix-unsigned.ipa --clobber
